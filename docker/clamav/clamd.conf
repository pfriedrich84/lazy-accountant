# Reviewed with ClamAV 1.5.5. Never relax partial-scan alerts.
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 127.0.0.1
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo no
MaxThreads 2
MaxQueue 4
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 1000
# Do not silently skip normalization below the global expanded scan ceiling.
MaxEmbeddedPE 100M
MaxHTMLNormalize 100M
MaxHTMLNoTags 100M
MaxScriptNormalize 100M
MaxZipTypeRcg 100M
PCREMaxFileSize 100M
MaxScanTime 45000
ReadTimeout 60
CommandReadTimeout 10
SendBufTimeout 1000
# Database changes are loaded by the on-demand gateway, never by a timer.
SelfCheck 0
ScanArchive yes
ScanPDF yes
ScanXMLDOCS yes
ScanOLE2 yes
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenMedia yes
