[project]
name = "lazy-accountant"
version = "0.1.0"
description = "Private document collection and accountant handover"
requires-python = ">=3.15,<3.16"
dependencies = [
  "Django==6.1.3",
  "djangorestframework==3.18.3",
  "django-q2==1.11.1",
  "mcp==2.3.0",
  "psycopg[binary]==3.3.9",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pypdf==7.1.1",
  "pypdfium2==5.15.2",
  "Pillow==13.0.0",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "cryptography==50.0.2",
  "starlette==1.10.0",
  "iso4217==1.16.20260101",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-django==4.14.0", "httpx==0.28.1", "ruff==0.17.5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["security: deferred scanner state-machine tests", "clamav: integration with real clamd and fresh signatures"]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
