name: Checks and full Compose smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Keep only the latest run for each PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: accountant
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: accountant
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U accountant" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: accountant
      POSTGRES_PASSWORD: synthetic-ci-password
      POSTGRES_DB: accountant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
          python-version: 3.15.2
      - run: uv sync --locked
      - run: uv run ruff check backend scripts && uv run ruff format --check backend scripts
      - run: uv run python backend/manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - name: Real ClamAV with production scan limits and encrypted/limit alerts
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name clamav-integration --memory=3g --cpus=2 \
            -p 127.0.0.1:13310:3310 -e FRESHCLAM_CHECKS=24 \
            -v "$PWD/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            -v "$PWD/docker/clamav/healthcheck.sh:/healthcheck.sh:ro" \
            --health-cmd='sh /healthcheck.sh' --health-interval=5s --health-start-period=10m \
            clamav/clamav:1.5.5@sha256:12177441d1b40cef3c47b44c4090d59d4babc4c67bedd5af0fa315e603aa6dd8
          ready=0
          for i in $(seq 1 180); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' clamav-integration)" = healthy ]; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = 1 ] || { docker logs clamav-integration; exit 1; }
          CLAMAV_HOST=127.0.0.1 CLAMAV_PORT=13310 RUN_CLAMAV_TESTS=1 uv run pytest -q -m clamav
      - if: always() && github.event_name != 'pull_request'
        run: |
          docker logs --tail=80 clamav-integration 2>/dev/null || true
          docker rm -f clamav-integration 2>/dev/null || true

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build

  # Full end-to-end coverage after merge and on explicit manual runs.
  compose:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.9
          python-version: 3.15.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: uv sync --locked && python3 scripts/init-env.py
      - run: docker compose --profile test-mail up --build -d --wait --wait-timeout 900
      - name: Internal real ClamAV, fresh signatures and EICAR
        run: |
          docker compose exec -T app python scripts/clamav_smoke.py
          python3 - <<'PY'
          import json, subprocess
          identifier = subprocess.check_output(['docker', 'compose', 'ps', '-q', 'clamav'], text=True).strip()
          scanner = json.loads(subprocess.check_output(['docker', 'inspect', identifier]))[0]
          assert not scanner['HostConfig']['PortBindings']
          assert not any(m['Destination'] == '/data' for m in scanner['Mounts'])
          PY
      - name: Named volume shared by non-root services and published host port
        run: |
          docker compose exec -T app python -c 'import os, stat; from pathlib import Path; p = Path("/data"); assert os.getuid() == 1000; assert p.stat().st_uid == 1000; assert stat.S_IMODE(p.stat().st_mode) == 0o700; (p / ".volume-smoke").write_text("shared-non-root")'
          docker compose exec -T worker python -c 'import os; from pathlib import Path; p = Path("/data/.volume-smoke"); assert os.getuid() == 1000; assert p.read_text() == "shared-non-root"; p.unlink()'
          python3 - <<'PY'
          import json, subprocess
          def container(service):
              id = subprocess.check_output(["docker", "compose", "ps", "-q", service], text=True).strip()
              return json.loads(subprocess.check_output(["docker", "inspect", id]))[0]
          app, worker = container("app"), container("worker")
          def volume(container):
              mount = next(m for m in container["Mounts"] if m["Destination"] == "/data")
              assert mount["Type"] == "volume"
              return mount["Name"]
          assert volume(app) == volume(worker)
          assert {"HostIp": "0.0.0.0", "HostPort": "8000"} in app["NetworkSettings"]["Ports"]["8000/tcp"]
          print("Gemeinsames Docker-Volume, private Rechte, Nicht-root-Zugriff und veröffentlichter Port bestätigt.")
          PY
      - name: Real MCP, IMAP, ORM worker and multipart SMTP month
        run: uv run python scripts/mcp_client.py --exercise --mail --report var/compose-report.json
      - name: Prepare browser fixtures
        run: |
          docker compose exec -T app python backend/manage.py bootstrap --sample-month 2026-10 --output /data/samples
          mkdir -p var/samples
          docker compose cp app:/data/samples/. var/samples/
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Browser upload-review-package, desktop and mobile
        run: |
          set -a; . ./.env; set +a
          echo "::add-mask::$ADMIN_PASSWORD"
          cd frontend && npm run test:browser
      - name: Worker restart and consistent backup/restore
        run: |
          docker compose restart worker
          docker compose up -d --wait app worker
          sh scripts/backup.sh var/ci-backup
          sh scripts/restore.sh var/ci-backup --yes-replace
          docker compose exec -T app python backend/manage.py verify_integrity
          uv run python scripts/mcp_client.py --verify-report var/compose-report.json --mail --report var/compose-restored-replay-report.json
          uv run python scripts/mcp_client.py --exercise --mail --report var/compose-after-restore-report.json
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150 app worker clamav
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-smoke-results
          path: |
            frontend/test-results/
            var/compose-report.json
            var/compose-after-restore-report.json
            var/compose-restored-replay-report.json
      - if: always()
        run: docker compose --profile test-mail down -v
