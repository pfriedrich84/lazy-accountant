<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Accountant — Logoentwurf</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f7; color: #175b50; font-family: 'Trebuchet MS', 'DejaVu Sans', sans-serif; }
    main { max-width: 1100px; margin: auto; padding: 64px; }
    h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: -.5px; }
    p { max-width: 65ch; margin: 0; color: #42675e; line-height: 1.6; }
    .logo { display: flex; align-items: center; min-height: 330px; margin-top: 32px; padding: 45px; background: white; }
    .logo img { display: block; width: 100%; max-width: 760px; height: auto; }
    .details { display: flex; align-items: center; justify-content: space-between; gap: 48px; padding-top: 40px; }
    .icons { display: flex; align-items: center; gap: 26px; }
    .swatches { display: flex; gap: 10px; }
    .swatches span { display: block; width: 32px; height: 32px; border-radius: 50%; }
    .caption { margin-top: 26px; font-size: 14px; }
    @media (max-width: 650px) { main { padding: 24px; } .logo { min-height: 200px; padding: 20px; } .details { flex-wrap: wrap; gap: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>Ein Helfer, der sich kümmert.</h1>
    <p>Logoentwurf für Lazy Accountant. An ArchiBots Roboter angelehnt, als eigenständiges, flaches Zeichen für die Belegarbeit neu gezeichnet.</p>
    <div class="logo"><img src="lazy-accountant-logo.svg" alt="lazy accountant. — grüner Roboter mit Beleg und Haken"></div>
    <div class="details">
      <div class="icons" aria-label="Icon in verschiedenen Größen">
        <img src="lazy-accountant-icon.svg" width="112" height="112" alt="Logozeichen in 112 Pixeln">
        <img src="lazy-accountant-icon.svg" width="64" height="64" alt="Logozeichen in 64 Pixeln">
        <img src="lazy-accountant-icon.svg" width="32" height="32" alt="Logozeichen in 32 Pixeln">
      </div>
      <div class="swatches" aria-label="Bestehende App-Palette: Grün, Kupfer und helles Mint">
        <span style="background:#175b50"></span><span style="background:#bf743b"></span><span style="background:#e3f0eb"></span>
      </div>
    </div>
    <p class="caption">Entspannter Blick, abgehakter Beleg, Originalfarben der App. In README, Anmeldung und Navigation eingebunden.</p>
  </main>
</body>
</html>
