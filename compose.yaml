name: lazy-accountant

x-app: &app
  build: .
  image: lazy-accountant:${APP_VERSION:-0.1.1}
  user: "1000:1000"
  environment: &environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/init-env.py first}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-accountant}
    POSTGRES_USER: ${POSTGRES_USER:-accountant}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,app:8000}
    MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://app:8000}
    BOOTSTRAP_DEMO: ${BOOTSTRAP_DEMO:-0}
    DATA_ROOT: /data
    MAX_FILE_BYTES: "${MAX_FILE_BYTES:-26214400}"
    MAX_PACKAGE_BYTES: "${MAX_PACKAGE_BYTES:-268435456}"
    MAX_PACKAGE_SOURCE_FILES: "${MAX_PACKAGE_SOURCE_FILES:-10000}"
    MAX_WORKBOOK_BANK_ROWS: "${MAX_WORKBOOK_BANK_ROWS:-10000}"
    MAX_WORKBOOK_BANK_BYTES: "${MAX_WORKBOOK_BANK_BYTES:-16777216}"
    CLAMAV_HOST: clamav
    CLAMAV_GATEWAY_PORT: "3311"
    CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-60}"
    CLAMAV_MAX_SIGNATURE_AGE: "${CLAMAV_MAX_SIGNATURE_AGE:-172800}"
  volumes:
    - documents:/data
  restart: unless-stopped
  init: true
  stop_grace_period: 6m

services:
  db:
    image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accountant}
      POSTGRES_USER: ${POSTGRES_USER:-accountant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clamav:
    # Pinned upstream engine + private on-demand update/scan gateway.
    build:
      context: .
      dockerfile: docker/clamav/Dockerfile
    image: lazy-accountant-clamav:${APP_VERSION:-0.1.1}
    environment:
      TZ: Etc/UTC
      CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-60}"
    volumes:
      - clamav-signatures:/var/lib/clamav
    # No published ports and, deliberately, no document volume.
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  app:
    <<: *app
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 6

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "backend/manage.py", "worker_health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Controlled synthetic mail system; never enabled by the normal production start.
  mail-test:
    profiles: ["test-mail"]
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users=belege:synthetic-mail-password@example.test,kanzlei:synthetic-mail-password@example.test"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    restart: "no"

volumes:
  postgres:
  documents:
  clamav-signatures:
